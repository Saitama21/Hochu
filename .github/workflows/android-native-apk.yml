name: Hochu Native APK
on:
  workflow_dispatch:
  push:
    branches: [experiment/android-native]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hochu-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
