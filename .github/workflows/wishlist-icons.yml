name: Wishlist Icon Assets

on:
  push:
    branches:
      - design/wishlist-v2-home
    paths:
      - 'public/assets/icons/wishlist-icon.webp'
      - 'scripts/generate-wishlist-icons.py'
      - '.github/workflows/wishlist-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build raster PNG sizes
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-wishlist-icons.py
      - name: Commit generated icon sizes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/icons/*.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(brand): sync PWA PNG icon sizes"
            git push origin HEAD:design/wishlist-v2-home
          fi
